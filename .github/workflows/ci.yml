name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: these jobs only check out, build and test.
permissions:
  contents: read

jobs:
  build-test:
    name: Build and test on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show Swift version
        run: swift --version

      - name: Resolve packages
        run: swift package resolve

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

  lint:
    name: Lint
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install SwiftLint
        run: brew install swiftlint
      - name: SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml
